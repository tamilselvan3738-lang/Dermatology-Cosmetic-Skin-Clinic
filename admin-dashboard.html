                  className="w-5 h-0.5 bg-current rounded-full transition-opacity"
                />
                <motion.span 
                  animate={mobileSidebarOpen ? { rotate: -45, y: -7 } : { rotate: 0, y: 0 }}
                  className="w-5 h-0.5 bg-current rounded-full transition-transform origin-center"
                />
              </div>
            </motion.button>
          </div>
        </header>
      );
    };

    // ------------------------------------------
    // SIDEBAR COMPONENT (Desktop Fixed Left, Mobile/Tab Sliding From Right)
    // ------------------------------------------
    const Sidebar = ({ 
      activeTab, 
      setActiveTab, 
      isDark, 
      setIsDark, 
      isRTL, 
      setIsRTL,
      onOpenLogout,
      mobileOpen,
      setMobileOpen,
      onRefresh,
      isRefreshing
    }) => {
      // 15 Modular Navigation Items matching user specifications
      const navItems = [
        { id: "overview", label: "Dashboard Overview", icon: IconChart, badge: "Live" },
        { id: "patients", label: "Patient Management", icon: IconUsers, badge: "3.4k" },
        { id: "doctors", label: "Doctor Management", icon: IconStethoscope, badge: "6 On Duty" },
        { id: "treatments", label: "Treatment Management", icon: IconLaser, badge: "12" },
        { id: "packages", label: "Treatment Packages", icon: IconPackage, badge: "6" },
        { id: "appointments", label: "Appointment Management", icon: IconCalendar, badge: "28 Today" },
        { id: "progress", label: "Treatment Progress", icon: IconActivity, badge: "89 Active" },
        { id: "photos", label: "Before & After Photos", icon: IconCamera, badge: "6 Sets" },
        { id: "prescriptions", label: "Prescription & Reports", icon: IconFileText, badge: null },
        { id: "billing", label: "Billing Management", icon: IconDollar, badge: null },
        { id: "payments", label: "Payment Management", icon: IconCreditCard, badge: "$184k" },
        { id: "notifications", label: "Notifications & Alerts", icon: IconBell, badge: "Alerts" },
        { id: "faqs", label: "FAQ Management", icon: IconHelp, badge: null },
        { id: "gallery", label: "B&A Gallery Showcase", icon: IconSparkles, badge: null },
        { id: "reports", label: "Clinical Analytics", icon: IconChart, badge: null },
      ];

      // Content for Sidebar
      const renderContent = (isDrawer = false) => (
        <div className="flex flex-col h-full bg-white dark:bg-obsidian-900 border-r border-slate-200/90 dark:border-slate-800 transition-colors">
          {/* Top Admin Header */}
          <div className="p-3.5 sm:p-5 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2">
            <div className="flex items-center gap-2 min-w-0">
              <div className="w-7 h-7 rounded-lg bg-gold-500/10 border border-gold-500/30 flex items-center justify-center text-gold-600 dark:text-gold-400 font-black text-xs flex-shrink-0">
                AD
              </div>
              <div className="min-w-0">
                <span className="block font-extrabold text-xs sm:text-sm tracking-wider uppercase text-slate-900 dark:text-white whitespace-nowrap">
                  ADMIN CONSOLE
                </span>
                <span className="block text-[10px] text-emerald-500 font-semibold truncate flex items-center gap-1">
                  <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
                  EMR Online • v4.8
                </span>
              </div>
            </div>

            {/* Quick Dark Mode & RTL Toggles + Close Button for Drawer (in mobile/tablet drawer) */}
            {isDrawer ? (
              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  onClick={() => setIsDark(!isDark)}
                  title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
                  className="p-1.5 rounded-lg text-slate-500 hover:text-slate-900 dark:text-slate-400 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-obsidian-850 transition-colors"
                >
                  {isDark ? <IconSun className="w-4 h-4 text-amber-400" /> : <IconMoon className="w-4 h-4" />}
                </button>
                <button
                  onClick={() => setIsRTL(!isRTL)}
                  title={isRTL ? "Switch to LTR" : "Switch to RTL"}
                  className={`px-2 py-0.5 rounded-lg text-[10px] font-bold border transition-colors ${
                    isRTL 
                      ? "bg-gold-500 text-white border-gold-600" 
                      : "text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-obsidian-850"
                  }`}
                >
                  {isRTL ? "LTR" : "RTL"}
                </button>
                <button
                  onClick={() => setMobileOpen(false)}
                  aria-label="Close Navigation Menu"
                  className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-obsidian-850"
                >
                  <IconX className="w-5 h-5" />
                </button>
              </div>
            ) : (
              <div className="flex items-center gap-1 text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 dark:bg-emerald-950/40 text-emerald-600 dark:text-emerald-400 border border-emerald-300/30">
                <span>ACTIVE</span>
              </div>
            )}
          </div>

          {/* Quick Drawer Secondary Actions (Refresh & Home in mobile) */}
          {isDrawer && (
            <div className="p-3 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between gap-2 bg-slate-50/50 dark:bg-obsidian-850/50">
              <a
                href="index.html"
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-300 hover:bg-white dark:hover:bg-obsidian-800 transition-colors border border-slate-200 dark:border-slate-800"
              >
                <IconHome className="w-3.5 h-3.5" />
                <span>Back to Home</span>
              </a>
              <button
                onClick={onRefresh}
                className="flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold bg-amber-50 dark:bg-amber-950/40 text-amber-700 dark:text-amber-300 border border-amber-300/40"
              >
                <motion.div animate={{ rotate: isRefreshing ? 360 : 0 }} transition={{ duration: 0.8, ease: "linear", repeat: isRefreshing ? Infinity : 0 }}>
                  <IconRefresh className="w-3.5 h-3.5" />
                </motion.div>
                <span>Refresh</span>
              </button>
            </div>
          )}

          {/* Navigation Links List */}
          <div className="flex-1 overflow-y-auto p-3 space-y-1">
            {navItems.map(item => {
              const Icon = item.icon;
              const isActive = activeTab === item.id;
              return (
                <button
                  key={item.id}
                  onClick={() => {
                    setActiveTab(item.id);
                    if (setMobileOpen) setMobileOpen(false);
                  }}
                  className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs font-semibold transition-all group ${
                    isActive
                      ? "bg-gold-500/15 dark:bg-gold-500/10 text-gold-700 dark:text-gold-300 border border-gold-400/40 shadow-sm"
                      : "text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-obsidian-850"
                  }`}
                >
                  <div className="flex items-center gap-2.5 min-w-0 flex-1">
                    <Icon className={`w-4 h-4 flex-shrink-0 ${isActive ? "text-gold-600 dark:text-gold-400" : "text-slate-400 group-hover:text-slate-600 dark:group-hover:text-slate-300"}`} />
                    <span className="whitespace-nowrap">{item.label}</span>
                  </div>
                  {item.badge && (
                    <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-md whitespace-nowrap flex-shrink-0 ml-1.5 ${
                      isActive
                        ? "bg-gold-500 text-white shadow-sm"
                        : "bg-slate-100 dark:bg-obsidian-800 text-slate-500 dark:text-slate-400"
                    }`}>
                      {item.badge}
                    </span>
                  )}
                </button>
              );
            })}

            {/* Logout item in sidebar */}
            <div className="pt-2 border-t border-slate-100 dark:border-slate-800/80">
              <button
                onClick={() => {
                  if (setMobileOpen) setMobileOpen(false);
                  window.location.href = 'login.html';
                }}
                className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors"
              >
                <IconLogout className="w-4 h-4" />
                <span>Sign Out Console</span>
              </button>
            </div>
          </div>

          {/* Bottom Sidebar Status */}
          <div className="p-3.5 border-t border-slate-100 dark:border-slate-800 bg-slate-50/50 dark:bg-obsidian-850/50 text-[10px] text-slate-400 flex items-center justify-between">
            <span className="flex items-center gap-1.5">
              <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse" />
              HIPAA Compliant v4.8
            </span>
            <span className="text-tealSkin-600 dark:text-tealSkin-400 font-semibold">SSL 256-Bit</span>
          </div>
        </div>
      );

      return (
        <>
          {/* Desktop Fixed Left Sidebar (Visible only on lg and above) */}
          <aside className="hidden lg:block w-72 xl:w-80 fixed left-0 top-16 sm:top-20 bottom-0 z-30 [dir='rtl']:left-auto [dir='rtl']:right-0">
            {renderContent(false)}
          </aside>

          {/* Mobile & Tablet Drawer (Slides in from the RIGHT when hamburger is tapped) */}
          <AnimatePresence>
            {mobileOpen && (
              <div className="fixed inset-0 z-[60] lg:hidden flex justify-end [dir='rtl']:justify-start">
                {/* Backdrop Blur */}
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  onClick={() => setMobileOpen(false)}
                  className="fixed inset-0 bg-black/60 backdrop-blur-sm"
                />

                {/* Drawer Body Sliding From RIGHT */}
                <motion.div
                  initial={{ x: isRTL ? "-100%" : "100%" }}
                  animate={{ x: 0 }}
                  exit={{ x: isRTL ? "-100%" : "100%" }}
                  transition={{ type: "spring", stiffness: 300, damping: 30 }}
                  className="relative w-80 max-w-[90vw] h-full shadow-2xl z-10 border-l [dir='rtl']:border-l-0 [dir='rtl']:border-r border-gold-500/20"
                >
                  {renderContent(true)}
                </motion.div>
              </div>
            )}
          </AnimatePresence>
        </>
      );
    };

    // ------------------------------------------
    // MAIN APP COMPONENT
    // ------------------------------------------
    function AdminApp() {
      // States
      const [isDark, setIsDark] = useState(true); // Default to Dark Mode to match reference screenshot
      const [isRTL, setIsRTL] = useState(false);
      const [activeTab, setActiveTab] = useState("overview");
      const [searchQuery, setSearchQuery] = useState("");
      const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);

      // Datasets
      const [patients, setPatients] = useState(initialPatients);
      const [doctors, setDoctors] = useState(initialDoctors);
      const [treatments, setTreatments] = useState(initialTreatments);
      const [packages, setPackages] = useState(initialPackages);
      const [appointments, setAppointments] = useState(initialAppointments);
      const [progress, setProgress] = useState(initialProgress);
      const [photos, setPhotos] = useState(initialPhotos);
      const [prescriptions, setPrescriptions] = useState(initialPrescriptions);
      const [invoices, setInvoices] = useState(initialInvoices);
      const [payments, setPayments] = useState(initialPayments);
      const [notifications, setNotifications] = useState(initialNotifications);
      const [faqs, setFaqs] = useState(initialFaqs);
      const [gallery, setGallery] = useState(initialGallery);
      const [reports, setReports] = useState(initialReports);
      const [liveEvents, setLiveEvents] = useState(liveOperationsFeed);

      // Modals
      const [activeModal, setActiveModal] = useState(null);
      const [selectedPatient, setSelectedPatient] = useState(null);
      const [isRefreshing, setIsRefreshing] = useState(false);
      const [toast, setToast] = useState(null);

      // Show Toast Helper
      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 3500);
      };

      // Refresh Live Metrics
      const handleRefresh = () => {
        setIsRefreshing(true);
        setTimeout(() => {
          setIsRefreshing(false);
          showToast("Clinical operations feed and telemetry metrics synchronized!");
        }, 1200);
      };

      // Add Patient Handler
      const handleAddPatient = (newP) => {
        setPatients([newP, ...patients]);
        showToast(`Patient ${newP.name} successfully registered in EMR system!`);
      };

      // Add Doctor Handler
      const handleAddDoctor = (newDoc) => {
        setDoctors([...doctors, newDoc]);
        showToast(`Dr. ${newDoc.name} profile added to clinical faculty!`);
      };

      // Book Appointment Handler
      const handleBookAppointment = (newApt) => {
        setAppointments([newApt, ...appointments]);
        showToast(`Appointment confirmed for ${newApt.patient} in ${newApt.suite}!`);
      };

      // Deactivate Patient Handler
      const handleDeactivatePatient = (mrn) => {
        setPatients(patients.map(p => p.id === mrn ? { ...p, status: "Archived" } : p));
        showToast(`Patient record ${mrn} archived successfully.`);
      };

      // Logout Confirm Handler
      const handleConfirmLogout = () => { window.location.href = 'login.html'; };

      // Sync dark mode class on HTML tag
      useEffect(() => {
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      }, [isDark]);

      // Render Active View
      const renderView = () => {
        switch (activeTab) {
          case "overview":
            return (
              <OverviewView
                patients={patients}
                doctors={doctors}
                appointments={appointments}
                onSelectPatient={(p) => setSelectedPatient(p)}
                onOpenModal={(modal) => setActiveModal(modal)}
                liveEvents={liveEvents}
              />
            );
          case "patients":
            return (
              <PatientsView
                patients={patients}
                onSelectPatient={(p) => setSelectedPatient(p)}
                onOpenModal={(modal) => setActiveModal(modal)}
                searchQuery={searchQuery}
              />
            );
          case "doctors":
            return (
              <DoctorsView
                doctors={doctors}
                onOpenModal={(modal) => setActiveModal(modal)}
              />
            );
          case "treatments":
            return <TreatmentsView treatments={treatments} />;
          case "packages":
            return <PackagesView packages={packages} />;
          case "appointments":
            return (
              <AppointmentsView
                appointments={appointments}
                onOpenModal={(modal) => setActiveModal(modal)}
              />
            );
          case "progress":
            return <ProgressView progress={progress} />;
          case "photos":
            return <PhotosView photos={photos} />;
          case "prescriptions":
            return <PrescriptionsView prescriptions={prescriptions} />;
          case "billing":
            return (
              <BillingView
                invoices={invoices}
                onOpenModal={(modal) => setActiveModal(modal)}
              />
            );
          case "payments":
            return <PaymentsView payments={payments} />;
          case "notifications":
            return (
              <NotificationsView
                notifications={notifications}
                onOpenModal={(modal) => setActiveModal(modal)}
              />
            );
          case "faqs":
            return <FaqsView faqs={faqs} />;
          case "gallery":
            return <GalleryView gallery={gallery} />;
          case "reports":
            return <ReportsView reports={reports} />;
          default:
            return null;
        }
      };

      return (
        <div 
          className={`min-h-screen w-full max-w-full overflow-x-hidden bg-[#FAF9F6] text-slate-800 transition-colors duration-300 ${isDark ? "dark bg-[#080C14] text-slate-100" : ""}`}
          dir={isRTL ? "rtl" : "ltr"}
        >
          {/* Top Header */}
          <TopHeader
            searchQuery={searchQuery}
            setSearchQuery={setSearchQuery}
            onRefresh={handleRefresh}
            isRefreshing={isRefreshing}
            onOpenNotifications={() => setActiveTab("notifications")}
            onOpenLogout={() => setActiveModal("logout")}
            onToggleMobileSidebar={() => setMobileSidebarOpen(!mobileSidebarOpen)}
            mobileSidebarOpen={mobileSidebarOpen}
            isDark={isDark}
            setIsDark={setIsDark}
            isRTL={isRTL}
            setIsRTL={setIsRTL}
          />

          {/* Sidebar (Desktop Fixed, Mobile Drawer) */}
          <Sidebar
            activeTab={activeTab}
            setActiveTab={setActiveTab}
            isDark={isDark}
            setIsDark={setIsDark}
            isRTL={isRTL}
            setIsRTL={setIsRTL}
            onOpenLogout={() => setActiveModal("logout")}
            mobileOpen={mobileSidebarOpen}
            setMobileOpen={setMobileSidebarOpen}
            onRefresh={handleRefresh}
            isRefreshing={isRefreshing}
          />

          {/* Main Content Area */}
          <div className="pt-16 sm:pt-20">
            <main className="lg:ml-72 xl:ml-80 [dir='rtl']:lg:ml-0 [dir='rtl']:lg:mr-72 [dir='rtl']:xl:mr-80 p-4 sm:p-6 lg:p-8 min-h-[calc(100vh-5rem)] min-w-0">
              <AnimatePresence mode="wait">
                <motion.div
                  key={activeTab}
                  initial={{ opacity: 0, y: 10 }}
                  animate={{ opacity: 1, y: 0 }}
                  exit={{ opacity: 0, y: -10 }}
                  transition={{ duration: 0.2 }}
                >
                  {renderView()}
                </motion.div>
              </AnimatePresence>
            </main>
          </div>

          {/* Modals & Drawers */}
          <AddPatientModal
            isOpen={activeModal === "addPatient"}
            onClose={() => setActiveModal(null)}
            onAddPatient={handleAddPatient}
          />

          <AddDoctorModal
            isOpen={activeModal === "addDoctor"}
            onClose={() => setActiveModal(null)}
            onAddDoctor={handleAddDoctor}
          />

          <BookAppointmentModal
            isOpen={activeModal === "bookAppointment"}
            onClose={() => setActiveModal(null)}
            onBookAppointment={handleBookAppointment}
            patients={patients}
            doctors={doctors}
          />

          <PatientDetailsDrawer
            patient={selectedPatient}
            onClose={() => setSelectedPatient(null)}
            onDeactivate={handleDeactivatePatient}
          />

          <LogoutModal
            isOpen={activeModal === "logout"}
            onClose={() => setActiveModal(null)}
            onConfirm={handleConfirmLogout}
          />

          {/* Toast Notification Alert */}
          <AnimatePresence>
            {toast && (
              <motion.div
                initial={{ opacity: 0, y: 20 }}
                animate={{ opacity: 1, y: 0 }}
                exit={{ opacity: 0, y: 20 }}
                className="fixed bottom-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-2xl bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-2xl border border-slate-700 dark:border-slate-200 text-xs font-bold"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400" />
                <span>{toast.message}</span>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<AdminApp />);
  </script>
</body>
</html>
