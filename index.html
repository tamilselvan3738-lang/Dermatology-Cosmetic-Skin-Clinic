    /* 3D TACTILE BUTTON WITH REAL PHYSICAL PUSH PHYSICS */
    .btn-3d-luxury {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.025em;
      color: #FFFFFF !important;

        0 8px 16px rgba(0, 0, 0, 0.35),

      transform: translateY(0);
      transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      user-select: none;
    }

    .btn-3d-luxury:hover {
      background: linear-gradient(180deg, #F0D59B 0%, #D1AD64 45%, #AD873B 100%);
      box-shadow:

        0 3px 6px rgba(0, 0, 0, 0.3),
        inset 0 2px 4px rgba(0, 0, 0, 0.35);
      transform: translateY(4px);
    }

    /* Shimmer light reflection sweep across 3D button */
    .shimmer-sweep {
      position: relative;
      overflow: hidden;
    }
    .shimmer-sweep::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -80%;
      width: 60%;
      height: 220%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      transition: all 0.8s ease;
    }
    .shimmer-sweep:hover::after {
      left: 150%;
    }

    /* RTL Direction Mirror Adjustments */
    [dir="rtl"] {
      text-align: right;
    }
    [dir="rtl"] .dropdown-menu {
      left: auto !important;
      right: 0 !important;
    }
    [dir="rtl"] .rtl-mirror {
      transform: scaleX(-1);
    }

    ::-webkit-scrollbar {
      width: 8px;

      background: rgba(0, 0, 0, 0.05);

        const isIPad = /iPad/i.test(ua) || ((navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) && navigator.maxTouchPoints > 1);
        return window.innerWidth > 1024 && !isIPad;
      });

          const ua = navigator.userAgent || '';
          const isIPad = /iPad/i.test(ua) || ((navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) && navigator.maxTouchPoints > 1);

        window.addEventListener('resize', updateLayout);
        return () => window.removeEventListener('resize', updateLayout);

        setIsDark(prev => {
          const next = !prev;
          if (next) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          return next;
        });
      };

                    className="p-2 rounded-xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-obsidian-850 hover:border-gold-400 dark:hover:border-gold-500 text-slate-700 dark:text-slate-200 shadow-sm transition-all"
                  >
                    <IconGlobe className="w-4 h-4 text-gold-500" />
                  </button>

                  {/* Dark Mode Toggle */}
                  <button
                    onClick={toggleDarkMode}
                    title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}

                      <IconSun className="w-4 h-4 text-amber-400" />

                  </button>

                  {/* 3D LOGIN BUTTON (Laptop View) */}
                  <Button3D
                    icon={IconKeyLock}
                    onClick={() => window.location.href = 'login.html'}

                    Login
                  </Button3D>

                </div>
                )}

                {/* --------------------------------------------------- */}
                {/* 4. RIGHT (Tablet & Mobile View): ONLY HAMBURGER     */}
                {/* As requested: logo on left, hamburger on right      */}
                {/* --------------------------------------------------- */}
                {!isLaptopView && (
                <div className="flex items-center">
                  <motion.button
                    whileTap={{ scale: 0.9 }}
                    onClick={() => setMobileOpen(!mobileOpen)}
                    aria-label="Toggle Mobile Menu"
                    className="p-2.5 rounded-xl border border-gold-400/50 dark:border-gold-500/40 bg-gold-50/70 dark:bg-obsidian-850 text-gold-700 dark:text-gold-300 shadow-sm"
                  >
                    <div className="w-5 h-4 flex flex-col justify-between items-center">
                      <motion.span 
                        animate={mobileOpen ? { rotate: 45, y: 7 } : { rotate: 0, y: 0 }}
                        className="w-5 h-0.5 bg-current rounded-full transition-transform origin-center"
                      />
                      <motion.span 
                        animate={mobileOpen ? { opacity: 0 } : { opacity: 1 }}
                        className="w-5 h-0.5 bg-current rounded-full transition-opacity"
                      />
                      <motion.span 
                        animate={mobileOpen ? { rotate: -45, y: -7 } : { rotate: 0, y: 0 }}
                        className="w-5 h-0.5 bg-current rounded-full transition-transform origin-center"
                      />
                    </div>
                  </motion.button>
                </div>
                )}

              </div>
            </div>
          </header>

          {/* ========================================================= */}
          {/* MOBILE & TABLET HAMBURGER DRAWER                          */}

          {/* Nav links, Dropdowns, Dark Mode, RTL, and 3D Login        */}

                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}

                  onClick={() => setMobileOpen(false)}
                  className="fixed inset-0 z-40 bg-black/60 backdrop-blur-sm"

                {/* Slide-in Drawer */}
                <motion.div
                  initial={{ x: isRTL ? '-100%' : '100%' }}
                  animate={{ x: 0 }}
                  exit={{ x: isRTL ? '-100%' : '100%' }}
                  transition={{ type: "spring", damping: 25, stiffness: 260 }}

                          <motion.div
                            initial={{ height: 0, opacity: 0 }}

                              onClick={() => handleNavClick("Home", "Home 1")}

                            >
                              Home 1
                            </button>
                            <button
                              onClick={() => handleNavClick("Home", "Home 2")}
                              className="w-full text-left [dir='rtl']:text-right px-3 py-2 rounded-lg text-xs font-semibold text-slate-800 dark:text-slate-200 hover:bg-gold-50 hover:text-gold-700 dark:hover:bg-gold-500/20 dark:hover:text-gold-300 transition-colors"

                            </button>
                          </motion.div>

                      </AnimatePresence>
                    </div>

                    {/* All Standard Links */}
                    {navLinks.map(link => (
                      <button
                        key={link}
                        onClick={() => handleNavClick(link)}
                        className={`w-full text-left [dir='rtl']:text-right px-3.5 py-2.5 rounded-xl font-semibold text-sm transition-all flex items-center justify-between ${
                          activeNav === link
                            ? 'bg-gold-500 text-white shadow-md'
                            : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-white/10'
                        }`}
                      >
                        <span>{link}</span>
                        {link === "Before & After" && (
                          <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-tealSkin-500 text-white">
                            NEW
                          </span>
                        )}
                      </button>
                    ))}

                    {/* Dashboard Accordion */}
                    <div className="rounded-xl border border-slate-200/80 dark:border-slate-800 overflow-hidden">
                      <button
                        onClick={() => setMobileAccordion(prev => ({ ...prev, dashboard: !prev.dashboard }))}
                        className="w-full flex items-center justify-between p-3 font-semibold text-sm text-slate-800 dark:text-slate-100 bg-slate-50 dark:bg-obsidian-850"
                      >
                        <span className="flex items-center gap-2">
                          <IconLayoutDashboard className="w-4 h-4 text-gold-500" /> Dashboard

                        <IconChevronDown rotate={mobileAccordion.dashboard} />

                          <motion.div
                            initial={{ height: 0, opacity: 0 }}
                            animate={{ height: "auto", opacity: 1 }}
                            exit={{ height: 0, opacity: 0 }}
                            className="bg-white dark:bg-obsidian-900 p-2 space-y-1 border-t border-slate-100 dark:border-slate-800"
                          >
                            <button
                              onClick={() => handleNavClick("Dashboard", "Admin Dashboard")}
                              className="w-full text-left [dir='rtl']:text-right px-3 py-2 rounded-lg text-xs font-semibold text-slate-800 dark:text-slate-200 hover:bg-gold-50 hover:text-gold-700 dark:hover:bg-gold-500/20 dark:hover:text-gold-300 transition-colors"
                            >
                              Admin Dashboard
                            </button>
                            <button
                              onClick={() => handleNavClick("Dashboard", "User Dashboard")}
                              className="w-full text-left [dir='rtl']:text-right px-3 py-2 rounded-lg text-xs font-semibold text-slate-800 dark:text-slate-200 hover:bg-gold-50 hover:text-gold-700 dark:hover:bg-gold-500/20 dark:hover:text-gold-300 transition-colors"
                            >
                              User Dashboard
                            </button>
                          </motion.div>
                        )}
                      </AnimatePresence>
                    </div>

                  </div>

                  {/* Drawer Footer: Dark Mode, RTL, and 3D Login Button */}

                      <button

                        className="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-obsidian-850 text-xs font-bold text-slate-700 dark:text-slate-200 shadow-sm"
                      >
                        {isDark ? <IconSun className="w-4 h-4 text-amber-400" /> : <IconMoon className="w-4 h-4 text-slate-600" />}
                        <span>{isDark ? "Light Mode" : "Dark Mode"}</span>
                      </button>

                      {/* RTL Toggle */}
                      <button
                        onClick={toggleRTL}
                        className="flex items-center justify-center gap-2 py-2 px-3 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-obsidian-850 text-xs font-bold text-slate-700 dark:text-slate-200 shadow-sm"
                      >
                        <IconGlobe className="w-4 h-4 text-gold-500" />
                        <span>{isRTL ? "RTL Direction" : "LTR Direction"}</span>
                      </button>
                    </div>

                    {/* 3D LOGIN BUTTON (Inside Mobile Drawer) */}
                    <Button3D
                      icon={IconKeyLock}
                      size="lg"
                      onClick={() => { setMobileOpen(false); window.location.href = 'login.html'; }}
                    >
                      Login to Clinical Portal
                    </Button3D>

                    <div className="text-center pt-1 text-[11px] text-slate-400 flex items-center justify-center gap-1.5">
                      <IconMapPin className="w-3.5 h-3.5 text-gold-500 flex-shrink-0" />
                      <span>742 Aesthetic Blvd, Suite 400 • (800) 337-6222</span>
                    </div>

                  </div>
                </motion.div>
              </>
            )}
          </AnimatePresence>

          {/* ========================================================= */}
          {/* 3D CLINICAL LOGIN MODAL                                    */}

          <AnimatePresence>
            {loginModal && (
              <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                <motion.div
                  initial={{ opacity: 0 }}
                  animate={{ opacity: 1 }}
                  exit={{ opacity: 0 }}
                  onClick={() => setLoginModal(false)}
                  className="fixed inset-0 bg-black/65 backdrop-blur-md"
                />

                <motion.div
                  initial={{ opacity: 0, scale: 0.9, y: 20 }}
                  animate={{ opacity: 1, scale: 1, y: 0 }}
                  exit={{ opacity: 0, scale: 0.9, y: 20 }}
                  className="relative z-10 w-full max-w-md bg-white dark:bg-obsidian-900 rounded-3xl shadow-2xl border border-gold-400/30 p-6 md:p-8 overflow-hidden text-left [dir='rtl']:text-right"
                >
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-slate-800">
                    <div className="flex items-center gap-2.5">
                      <div className="w-10 h-10 rounded-xl bg-gold-100 dark:bg-gold-950/60 border border-gold-400/30 flex items-center justify-center text-gold-600 dark:text-gold-300">
                        <IconKeyLock className="w-5 h-5" />
                      </div>
                      <div>
                        <h3 className="font-serif text-lg font-bold text-slate-900 dark:text-white">
                          Clinical Portal Login
                        </h3>
                        <p className="text-xs text-slate-500 dark:text-slate-400">
                          Secure HIPAA-Compliant Access
                        </p>
                      </div>
                    </div>
                    <button
                      onClick={() => setLoginModal(false)}
                      className="p-2 rounded-xl text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
                    >
                      <IconClose className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Tabs */}
                  <div className="grid grid-cols-2 gap-1.5 p-1 my-5 bg-slate-100 dark:bg-obsidian-850 rounded-xl">
                    <button
                      onClick={() => setLoginTab("patient")}
                      className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                        loginTab === "patient"
                          ? "bg-white dark:bg-obsidian-700 text-gold-700 dark:text-gold-300 shadow-sm"
                          : "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                      }`}
                    >
                      <IconUser className="w-3.5 h-3.5" />
                      <span>Patient Login</span>
                    </button>
                    <button
                      onClick={() => setLoginTab("doctor")}
                      className={`py-2 text-xs font-bold rounded-lg transition-all flex items-center justify-center gap-1.5 ${
                        loginTab === "doctor"
                          ? "bg-white dark:bg-obsidian-700 text-gold-700 dark:text-gold-300 shadow-sm"
                          : "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                      }`}
                    >
                      <IconStethoscope className="w-3.5 h-3.5" />
                      <span>Doctor / Admin</span>
                    </button>
                  </div>

                  <form 
                    onSubmit={(e) => {
                      e.preventDefault();
                      setLoginModal(false);
                    }} 
                    className="space-y-4"
                  >
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
                        {loginTab === "patient" ? "Patient ID / Email" : "Doctor License / Email"}
                      </label>
                      <input 
                        type="text" 
                        required
                        placeholder={loginTab === "patient" ? "patient@derma.com" : "dr.sarah@derma.com"}
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-obsidian-850 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase tracking-wider text-slate-600 dark:text-slate-300 mb-1.5">
                        Password
                      </label>
                      <input 
                        type="password" 
                        required
                        placeholder="••••••••••••"
                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-obsidian-850 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20"
                      />
                    </div>

                    <div className="pt-2">
                      <Button3D size="lg">
                        Authenticate & Access
                      </Button3D>
                    </div>
                  </form>
                </motion.div>
              </div>
            )}
          </AnimatePresence>

                    {/* ========================================================= */}
          {/* MAIN HOMEPAGE CONTENT (7 BESPOKE CLINICAL SECTIONS)        */}
          {/* ========================================================= */}
          <main className="flex-1 w-full overflow-hidden">
            <IndexHeroSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
              onExploreSpecialties={() => {
                const el = document.getElementById('specialties');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexSpecialtiesSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexTargetedSolutionsSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexWhyChooseSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexFacultyAndFacilitiesSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexBeforeAfterSection 
              onOpenBooking={() => {
                const el = document.getElementById('book-appointment');
                if (el) el.scrollIntoView({ behavior: 'smooth' });
              }}
            />

            <IndexFaqAndBookingSection />
          </main>

          {/* Luxury Comprehensive Clinic Footer Based on Navbar */}
          <Footer
            activeNav={activeNav}
            handleNavClick={handleNavClick}
            setLoginModal={setLoginModal}
          />

        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
