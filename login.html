      // Generate deterministic particle dots for background depth
      const particles = [
        { id: 1, x: "12%", y: "18%", size: 3, delay: 0, dur: 4.5 },
        { id: 2, x: "85%", y: "24%", size: 4, delay: 1.2, dur: 6 },
        { id: 3, x: "22%", y: "78%", size: 2.5, delay: 2, dur: 5 },
        { id: 4, x: "74%", y: "72%", size: 3.5, delay: 0.5, dur: 5.5 },
        { id: 5, x: "92%", y: "45%", size: 2, delay: 3, dur: 4 },
        { id: 6, x: "8%", y: "52%", size: 4, delay: 1.8, dur: 6.5 },
        { id: 7, x: "48%", y: "10%", size: 3, delay: 2.5, dur: 5.2 },
        { id: 8, x: "62%", y: "88%", size: 2.5, delay: 0.8, dur: 4.8 },
      ];

      return (
        <div className="fixed inset-0 pointer-events-none overflow-hidden z-0 max-w-[100vw]">
          {/* Subtle Ambient Radial Glow Blobs */}
          <div className="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-64 h-64 sm:w-80 sm:h-80 md:w-[600px] md:h-[600px] max-w-full rounded-full bg-gold-500/10 dark:bg-gold-500/5 blur-[120px]" />
          <div className="absolute bottom-10 left-1/3 w-56 h-56 sm:w-72 sm:h-72 md:w-[500px] md:h-[500px] max-w-full rounded-full bg-tealSkin-500/10 dark:bg-tealSkin-500/5 blur-[100px]" />
          
          {/* Golden floating micro-orbs */}
          {particles.map((p) => (
            <motion.div
              key={p.id}
              className="absolute rounded-full bg-gradient-to-r from-gold-400 to-amber-300 shadow-[0_0_8px_#C5A059]"
              style={{
                left: p.x,
                top: p.y,
                width: `${p.size}px`,
                height: `${p.size}px`,
              }}
              animate={{
                y: [0, -18, 0],
                opacity: [0.3, 0.9, 0.3],
                scale: [0.9, 1.3, 0.9],
              }}
              transition={{
                duration: p.dur,
                delay: p.delay,
                repeat: Infinity,
                ease: "easeInOut",
              }}
            />
          ))}
        </div>
      );
    };

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    const App = () => {
      const [isDark, setIsDark] = useState(true); // Default to Dark Mode as per user's screenshot
      const [isRTL, setIsRTL] = useState(false);
      
      // Auth States: 'login' | 'register' | 'forgot'
      const [authMode, setAuthMode] = useState('login');
      // Portal Role: 'patient' | 'doctor'
      const [role, setRole] = useState('patient');

      // Form inputs
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [fullName, setFullName] = useState('');
      const [phone, setPhone] = useState('');
      const [treatmentInterest, setTreatmentInterest] = useState('Acne & Scar Revision');
      const [rememberMe, setRememberMe] = useState(true);
      const [showPassword, setShowPassword] = useState(false);
      
      // UX feedback states
      const [isLoading, setIsLoading] = useState(false);
      const [toast, setToast] = useState(null);

      // Handle Dark Mode toggling with documentElement class sync
      useEffect(() => {
        const root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.classList.remove('light');
        } else {
          root.classList.remove('dark');
          root.classList.add('light');
        }
      }, [isDark]);

      // Handle RTL toggling
      useEffect(() => {
        document.documentElement.dir = isRTL ? 'rtl' : 'ltr';
      }, [isRTL]);

      const toggleDarkMode = () => setIsDark(prev => !prev);
      const toggleRTL = () => setIsRTL(prev => !prev);

      const showToast = (message, type = "success") => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        setIsLoading(true);

        setTimeout(() => {
          setIsLoading(false);
          if (authMode === 'login') {
            showToast(`Welcome back to Derma·Aura! Accessing ${role === 'patient' ? 'Patient Health Records' : 'Staff EHR Console'}...`, "success");
            setTimeout(() => {
              if (role === 'doctor') {
                window.location.href = "admin-dashboard.html";
              } else {
                window.location.href = "about.html";
              }
            }, 1600);
          } else if (authMode === 'register') {
            showToast("Account successfully registered! Verification link sent to your email.", "success");
            setTimeout(() => setAuthMode('login'), 2000);
          } else if (authMode === 'forgot') {
            showToast("Password recovery link has been dispatched to your email address.", "success");
            setTimeout(() => setAuthMode('login'), 2200);
          }
        }, 1200);
      };

      const handleSocialLogin = (provider) => {
        setIsLoading(true);
        setTimeout(() => {
          setIsLoading(false);
          showToast(`Connecting securely via ${provider}... Redirecting to ${role === 'patient' ? 'Patient Portal' : 'Doctor Portal'}.`, "success");
          setTimeout(() => {
            window.location.href = "about.html";
          }, 1500);
        }, 900);
      };

      return (
        <div className="relative min-h-screen h-screen w-screen flex items-center justify-center transition-colors duration-400 bg-[#FAF9F6] dark:bg-[#080C14] text-slate-900 dark:text-slate-100 overflow-hidden p-4 sm:p-6 select-none">
          
          {/* Ambient Particles Layer */}
          <ParticleField />

          {/* TOP RIGHT CONTROLS (RTL & Theme Toggle, exactly matching screenshot) */}
          <div className="fixed top-4 right-4 sm:top-6 sm:right-6 flex items-center gap-2 sm:gap-2.5 z-30 [dir='rtl']:right-auto [dir='rtl']:left-4 [dir='rtl']:sm:left-6">
            {/* RTL Switcher */}
            <button
              onClick={toggleRTL}
              title={isRTL ? "Switch to LTR" : "Switch to RTL"}
              className="p-2 sm:p-2.5 rounded-xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-obsidian-850/80 backdrop-blur-md hover:border-gold-400 dark:hover:border-gold-500 text-slate-700 dark:text-slate-200 shadow-sm hover:scale-105 active:scale-95 transition-all"
            >
              <IconGlobe className="w-4 h-4 text-gold-500" />
            </button>

            {/* Dark/Light Mode Toggle */}
            <button
              onClick={toggleDarkMode}
              title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
              className="p-2 sm:p-2.5 rounded-xl border border-slate-200/90 dark:border-slate-800 bg-white/80 dark:bg-obsidian-850/80 backdrop-blur-md hover:border-gold-400 dark:hover:border-gold-500 text-slate-700 dark:text-slate-200 shadow-sm hover:scale-105 active:scale-95 transition-all"
            >
              {isDark ? (
                <IconSun className="w-4 h-4 text-amber-400" />
              ) : (
                <IconMoon className="w-4 h-4 text-gold-600" />
              )}
            </button>
          </div>

          {/* ========================================================= */}
          {/* MAIN LOGIN CARD CONTAINER (Centered with Framer Motion) */}
          {/* ========================================================= */}
          <main className="w-full flex items-center justify-center z-10">
            <motion.div 
              initial={{ opacity: 0, y: 22, scale: 0.98 }}
              animate={{ opacity: 1, y: 0, scale: 1 }}
              transition={{ duration: 0.45, ease: "easeOut" }}
              className="w-full max-w-[465px] bg-white/95 dark:bg-[#0c121e]/90 backdrop-blur-2xl rounded-2xl sm:rounded-3xl p-5 sm:p-8 border border-slate-200/90 dark:border-slate-700/60 shadow-[0_20px_60px_rgba(0,0,0,0.12)] dark:shadow-[0_25px_70px_rgba(0,0,0,0.7)] relative overflow-hidden"
            >
              {/* Top Accent Luxury Ribbon */}
              <div className="absolute top-0 left-0 right-0 h-1 bg-gradient-to-r from-transparent via-gold-500 to-transparent opacity-80" />

              {/* Toast Feedback Notification */}
              <AnimatePresence>
                {toast && (
                  <motion.div
                    initial={{ opacity: 0, y: -16, scale: 0.95 }}
                    animate={{ opacity: 1, y: 0, scale: 1 }}
                    exit={{ opacity: 0, y: -12, scale: 0.95 }}
                    className="mb-5 p-3 rounded-xl bg-tealSkin-50 dark:bg-tealSkin-950/90 border border-tealSkin-400 text-tealSkin-900 dark:text-tealSkin-200 text-xs sm:text-sm font-medium flex items-center gap-2 shadow-md"
                  >
                    <IconCheck className="w-4 h-4 text-tealSkin-600 dark:text-tealSkin-400 flex-shrink-0" />
                    <span>{toast.message}</span>
                  </motion.div>
                )}
              </AnimatePresence>

              {/* 1. CARD HEADER: Clinic Logo */}
              <div className="flex flex-col items-center justify-center text-center mb-6">
                <AnimaticLogo />
              </div>

              {/* 2. FORM BODY */}
              <form onSubmit={handleSubmit} className="space-y-4">
                
                {/* When in REGISTER Mode: Full Name & Phone */}
                {authMode === 'register' && (
                  <motion.div 
                    initial={{ opacity: 0, height: 0 }}
                    animate={{ opacity: 1, height: 'auto' }}
                    exit={{ opacity: 0, height: 0 }}
                    className="space-y-4"
                  >
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left [dir='rtl']:text-right">
                        Full Legal Name
                      </label>
                      <div className="relative">
                        <input
                          type="text"
                          required
                          value={fullName}
                          onChange={(e) => setFullName(e.target.value)}
                          placeholder="e.g. Dr. Eleanor Vance or John Doe"
                          className="w-full bg-slate-50 dark:bg-obsidian-850/90 border border-slate-300 dark:border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition-all"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left [dir='rtl']:text-right">
                        Mobile Phone Number
                      </label>
                      <input
                        type="tel"
                        required
                        value={phone}
                        onChange={(e) => setPhone(e.target.value)}
                        placeholder="+1 (555) 234-5678"
                        className="w-full bg-slate-50 dark:bg-obsidian-850/90 border border-slate-300 dark:border-slate-700/80 rounded-xl px-4 py-2.5 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition-all"
                      />
                    </div>
                  </motion.div>
                )}

                {/* USERNAME OR EMAIL FIELD */}
                <div>
                  <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left [dir='rtl']:text-right">
                    {authMode === 'forgot' ? 'Registered Account Email' : 'Username or Email'}
                  </label>
                  <div className="relative">
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder={role === 'doctor' ? "e.g. doctor@dermaura.com" : "e.g. resident@example.com"}
                      className="w-full bg-slate-50 dark:bg-obsidian-850/90 border border-slate-300 dark:border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition-all"
                    />
                  </div>
                </div>

                {/* PASSWORD FIELD (Hidden in forgot mode) */}
                {authMode !== 'forgot' && (
                  <div>
                    <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5 text-left [dir='rtl']:text-right">
                      Password
                    </label>
                    <div className="relative flex items-center">
                      <input
                        type={showPassword ? "text" : "password"}
                        required
                        value={password}
                        onChange={(e) => setPassword(e.target.value)}
                        placeholder="Enter your password"
                        className="w-full bg-slate-50 dark:bg-obsidian-850/90 border border-slate-300 dark:border-slate-700/80 rounded-xl px-4 py-3 text-sm text-slate-900 dark:text-white placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20 transition-all pr-11 [dir='rtl']:pr-4 [dir='rtl']:pl-11"
                      />
                      {/* Password Visibility Eye Toggle */}
                      <button
                        type="button"
                        onClick={() => setShowPassword(!showPassword)}
                        className="absolute right-3.5 [dir='rtl']:right-auto [dir='rtl']:left-3.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors p-1"
                        title={showPassword ? "Hide password" : "Show password"}
                      >
                        {showPassword ? (
                          <IconEyeOff className="w-4 h-4" />
                        ) : (
                          <IconEye className="w-4 h-4" />
                        )}
                      </button>
                    </div>
                  </div>
                )}

                {/* REMEMBER ME & FORGOT PASSWORD ROW (In Login mode) */}
                {authMode === 'login' && (
                  <div className="flex items-center justify-between pt-1">
                    <label className="flex items-center gap-2 cursor-pointer select-none">
                      <input
                        type="checkbox"
                        checked={rememberMe}
                        onChange={(e) => setRememberMe(e.target.checked)}
                        className="w-4 h-4 rounded border-slate-300 dark:border-slate-700 text-gold-500 focus:ring-gold-500/30 accent-gold-500"
                      />
                      <span className="text-xs font-medium text-slate-600 dark:text-slate-300">
                        Remember me
                      </span>
                    </label>

                    <button
                      type="button"
                      onClick={() => setAuthMode('forgot')}
                      className="text-xs font-semibold text-gold-600 dark:text-gold-400 hover:text-gold-700 dark:hover:text-gold-300 transition-colors"
                    >
                      Forgot Password?
                    </button>
                  </div>
                )}

                {/* FORGOT PASSWORD CANCEL LINK */}
                {authMode === 'forgot' && (
                  <div className="flex justify-end pt-1">
                    <button
                      type="button"
                      onClick={() => setAuthMode('login')}
                      className="text-xs font-semibold text-gold-600 dark:text-gold-400 hover:text-gold-700 dark:hover:text-gold-300 transition-colors"
                    >
                      Back to Sign In
                    </button>
                  </div>
                )}

                {/* 3. PRIMARY ACTION BUTTON */}
                <div className="pt-2">
                  <button
                    type="submit"
                    disabled={isLoading}
                    className="w-full btn-3d-luxury shimmer-sweep py-3.5 text-sm sm:text-base font-bold shadow-lg shadow-gold-500/20 active:translate-y-1 transition-all flex items-center justify-center gap-2 disabled:opacity-75 disabled:cursor-not-allowed"
                  >
                    {isLoading ? (
                      <span className="inline-block w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin" />
                    ) : (
                      <>
                        <IconLock className="w-4 h-4 text-amber-100 flex-shrink-0" />
                        <span>
                          {authMode === 'login' 
                            ? (role === 'patient' ? "Log In to Dashboard" : "Log In to EHR Console")
                            : authMode === 'register'
                            ? "Complete Patient Registration"
                            : "Send Recovery Link"}
                        </span>
                      </>
                    )}
                  </button>
                </div>
              </form>

              {/* 4. DIVIDER: "OR CONTINUE WITH" */}
              <div className="relative my-6">
                <div className="absolute inset-0 flex items-center">
                  <div className="w-full border-t border-slate-200 dark:border-slate-800" />
                </div>
                <div className="relative flex justify-center text-[10.5px] uppercase tracking-widest font-bold">
                  <span className="bg-white dark:bg-[#0c121e] px-3 text-slate-400 dark:text-slate-500">
                    OR CONTINUE WITH
                  </span>
                </div>
              </div>

              {/* 5. SOCIAL LOGIN ICONS ROW (Google, Facebook, Apple) */}
              <div className="grid grid-cols-3 gap-3 mb-6">
                {/* Google */}
                <button
                  type="button"
                  onClick={() => handleSocialLogin("Google")}
                  className="flex items-center justify-center py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50/70 dark:bg-obsidian-850 hover:bg-slate-100 dark:hover:bg-obsidian-800 hover:border-gold-400/60 dark:hover:border-gold-500/50 hover:scale-[1.03] active:scale-[0.98] transition-all shadow-sm"
                  title="Sign in with Google"
                >
                  <IconGoogle className="w-5 h-5" />
                </button>

                {/* Facebook */}
                <button
                  type="button"
                  onClick={() => handleSocialLogin("Facebook")}
                  className="flex items-center justify-center py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50/70 dark:bg-obsidian-850 hover:bg-slate-100 dark:hover:bg-obsidian-800 hover:border-gold-400/60 dark:hover:border-gold-500/50 hover:scale-[1.03] active:scale-[0.98] transition-all shadow-sm"
                  title="Sign in with Facebook"
                >
                  <IconFacebook className="w-5 h-5" />
                </button>

                {/* Apple */}
                <button
                  type="button"
                  onClick={() => handleSocialLogin("Apple")}
                  className="flex items-center justify-center py-2.5 px-3 rounded-xl border border-slate-200 dark:border-slate-700/80 bg-slate-50/70 dark:bg-obsidian-850 hover:bg-slate-100 dark:hover:bg-obsidian-800 hover:border-gold-400/60 dark:hover:border-gold-500/50 hover:scale-[1.03] active:scale-[0.98] transition-all shadow-sm text-slate-800 dark:text-white"
                  title="Sign in with Apple"
                >
                  <IconApple className="w-5 h-5" />
                </button>
              </div>

              {/* 6. SECONDARY OUTLINE BUTTON: "Create New Account ->" */}
              <div className="mb-6">
                <a
                  href="registeration.html"
                  className="w-full py-3 px-4 rounded-xl border border-gold-500/50 dark:border-gold-500/40 text-gold-700 dark:text-gold-400 hover:bg-gold-50/70 dark:hover:bg-gold-500/10 font-bold text-xs sm:text-sm tracking-wide flex items-center justify-center gap-2 hover:scale-[1.01] active:scale-[0.98] transition-all cursor-pointer"
                >
                  <span>Create New Account</span>
                  <IconArrowRight className="w-4 h-4 rtl-mirror" />
                </a>
              </div>

              {/* 7. FOOTER SECURITY NOTICE */}
              <div className="flex items-center justify-center gap-1.5 text-[11px] text-tealSkin-600 dark:text-tealSkin-400 font-medium">
                <IconShieldCheck className="w-4 h-4 flex-shrink-0" />
                <span>256-Bit SSL Encrypted & HIPAA Secure</span>
              </div>
            </motion.div>
          </main>
        </div>
      );
    };

    // Render the React application into #root
    const rootElement = document.getElementById("root");
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<App />);
  </script>
</body>
</html>
