                {/* Right Drawer */}
                <div 
                  className="fixed top-0 right-0 [dir='rtl']:right-auto [dir='rtl']:left-0 bottom-0 z-[61] w-72 sm:w-80 bg-white dark:bg-obsidian-900 border-l [dir='rtl']:border-r [dir='rtl']:border-l-0 border-slate-200 dark:border-white/10 flex flex-col p-4 shadow-2xl overflow-y-auto animate-slideInRight"
                >
                  {/* Drawer Header */}
                  <div className="flex items-center justify-between pb-4 border-b border-slate-100 dark:border-white/5">
                    <div className="flex items-center gap-2.5">
                      <img 
                        src={PATIENT_PROFILE.avatarUrl} 
                        alt={PATIENT_PROFILE.fullName} 
                        className="w-10 h-10 rounded-xl object-cover border border-gold-500/40"
                      />
                      <div>
                        <p className="text-xs font-bold text-slate-900 dark:text-white truncate">{PATIENT_PROFILE.fullName}</p>
                        <p className="text-[10px] text-gold-600 dark:text-gold-400 font-semibold">{PATIENT_PROFILE.tier}</p>
                      </div>
                    </div>

                    <button
                      onClick={() => setIsMobileMenuOpen(false)}
                      className="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 dark:hover:text-white hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
                    >
                      <IconX className="w-5 h-5" />
                    </button>
                  </div>

                  {/* Drawer Nav Items */}
                  <div className="flex-1 py-4 space-y-1">
                    {NAV_ITEMS.map(item => {
                      const isActive = currentTab === item.id;
                      const Icon = item.icon;
                      return (
                        <button
                          key={item.id}
                          onClick={() => handleNavClick(item.id)}
                          className={`w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-semibold transition-all ${
                            isActive
                              ? "bg-slate-900 dark:bg-gold-500 text-white dark:text-obsidian-950 font-bold shadow-md"
                              : "text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5"
                          }`}
                        >
                          <div className="flex items-center gap-3">
                            <Icon className="w-4 h-4 flex-shrink-0" />
                            <span className="whitespace-nowrap">{item.label}</span>
                          </div>
                          {item.badge && (
                            <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-gold-500/20 text-gold-500">
                              {item.badge}
                            </span>
                          )}
                        </button>
                      );
                    })}
                  </div>

                  {/* Drawer Bottom Actions */}
                  <div className="pt-4 border-t border-slate-100 dark:border-white/5 space-y-2">
                    <a
                      href="index.html"
                      className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-white/5 transition-colors"
                    >
                      <IconHome className="w-4 h-4" />
                      <span>Back to Home</span>
                    </a>
                    <button
                      onClick={() => {
                        setIsMobileMenuOpen(false);
                        window.location.href = 'login.html';
                      }}
                      className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-xs font-semibold text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 transition-colors"
                    >
                      <IconLogout className="w-4 h-4" />
                      <span>Logout</span>
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* MAIN CONTENT AREA */}
            <main className="lg:ml-72 xl:ml-80 [dir='rtl']:lg:ml-0 [dir='rtl']:lg:mr-72 [dir='rtl']:xl:mr-80 p-4 sm:p-6 lg:p-8 min-w-0 max-w-full overflow-x-hidden flex-1">
              {currentTab === "overview" && (
                <OverviewView 
                  onNavigate={handleNavClick}
                  onOpenBookModal={() => setIsBookModalOpen(true)}
                  onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                  onSelectReport={(rep) => setSelectedReport(rep)}
                  onSelectPhoto={(photo) => setSelectedPhotoSet(photo)}
                />
              )}

              {currentTab === "profile" && (
                <ProfileView 
                  onOpenEditModal={() => setIsEditProfileOpen(true)}
                  onOpenPasswordModal={() => setIsChangePasswordOpen(true)}
                />
              )}

              {currentTab === "book" && (
                <BookAppointmentView 
                  onBookSuccess={(info) => {
                    showToast(`Appointment reserved with ${info.doctor} for ${info.date}`);
                  }}
                />
              )}

              {currentTab === "appointments" && (
                <AppointmentsView 
                  onOpenBookModal={() => setIsBookModalOpen(true)}
                  onCancelAppointment={(apt) => setCancellingAppointment(apt)}
                />
              )}

              {currentTab === "treatments" && (
                <TreatmentsView />
              )}

              {currentTab === "packages" && (
                <PackagesView 
                  onOpenBookModal={() => setIsBookModalOpen(true)}
                />
              )}

              {currentTab === "progress" && (
                <ProgressView 
                  onSelectPhoto={(set) => setSelectedPhotoSet(set)}
                />
              )}

              {currentTab === "photos" && (
                <PhotosView 
                  onSelectPhoto={(set) => setSelectedPhotoSet(set)}
                />
              )}

              {currentTab === "reports" && (
                <ReportsView 
                  onSelectReport={(rep) => setSelectedReport(rep)}
                />
              )}

              {currentTab === "payments" && (
                <PaymentsView />
              )}

              {currentTab === "invoices" && (
                <InvoicesView 
                  onSelectInvoice={(inv) => setSelectedInvoice(inv)}
                />
              )}

              {currentTab === "notifications" && (
                <NotificationsView 
                  onNavigate={handleNavClick}
                />
              )}
            </main>
          </div>

          {/* ALL INTERACTIVE MODALS */}
          <BookAppointmentWizardModal 
            isOpen={isBookModalOpen}
            onClose={() => setIsBookModalOpen(false)}
            onBookSuccess={(info) => {
              showToast(`Appointment confirmed: ${info.treatment} on ${info.date}`);
            }}
          />

          <ViewInvoiceModal 
            invoice={selectedInvoice}
            isOpen={!!selectedInvoice}
            onClose={() => setSelectedInvoice(null)}
          />

          <ViewReportModal 
            report={selectedReport}
            isOpen={!!selectedReport}
            onClose={() => setSelectedReport(null)}
          />

          <ComparePhotosModal 
            photoSet={selectedPhotoSet}
            isOpen={!!selectedPhotoSet}
            onClose={() => setSelectedPhotoSet(null)}
          />

          <EditProfileModal 
            isOpen={isEditProfileOpen}
            onClose={() => setIsEditProfileOpen(false)}
            onSave={(data) => {
              showToast("Profile details updated successfully");
            }}
          />

          <ChangePasswordModal 
            isOpen={isChangePasswordOpen}
            onClose={() => setIsChangePasswordOpen(false)}
            onSuccess={() => {
              showToast("Security password changed successfully");
            }}
          />

          <CancelAppointmentModal 
            appointment={cancellingAppointment}
            isOpen={!!cancellingAppointment}
            onClose={() => setCancellingAppointment(null)}
            onConfirmCancel={(id, reason) => {
              showToast(`Appointment #${id} has been cancelled`);
            }}
          />

          <LogoutModal 
            isOpen={isLogoutModalOpen}
            onClose={() => setIsLogoutModalOpen(false)}
          />
        </div>
      );
    };



    // Mount Patient Dashboard to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<UserDashboardApp />);
  </script>
</body>
</html>
