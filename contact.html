    body {

      color: inherit;
      transition: background-color 0.4s ease, color 0.4s ease;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 3D TACTILE BUTTON WITH REAL PHYSICAL PUSH PHYSICS */
    .btn-3d-luxury {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.025em;
      color: #FFFFFF !important;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
      background: linear-gradient(180deg, #E6C887 0%, #C5A059 45%, #9E7A32 100%);
      border-radius: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.65);
      border-left: 1px solid rgba(255, 255, 255, 0.35);
      border-right: 1px solid rgba(0, 0, 0, 0.2);
      border-bottom: 2px solid #583F15;
      box-shadow: 
        0 5px 0 #684815,
        0 8px 16px rgba(0, 0, 0, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transform: translateY(0);
      transition: all 0.12s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      user-select: none;
    }

    .btn-3d-luxury:hover {
      background: linear-gradient(180deg, #F0D59B 0%, #D1AD64 45%, #AD873B 100%);
      box-shadow: 
        0 6px 0 #684815,
        0 12px 22px rgba(197, 160, 89, 0.45),
        inset 0 1px 0 rgba(255, 255, 255, 0.7);
      transform: translateY(-2px);
    }

    .btn-3d-luxury:active {
      background: linear-gradient(180deg, #BFA057 0%, #A9843A 60%, #876523 100%);
      box-shadow: 
        0 1px 0 #684815,
        0 3px 6px rgba(0, 0, 0, 0.3),
        inset 0 2px 4px rgba(0, 0, 0, 0.35);
      transform: translateY(4px);
    }

    /* Shimmer light reflection sweep across 3D button */
    .shimmer-sweep {
      position: relative;
      overflow: hidden;
    }
    .shimmer-sweep::after {
      content: '';
      position: absolute;
      top: -60%;
      left: -80%;
      width: 60%;
      height: 220%;
      background: linear-gradient(
        60deg,
        rgba(255, 255, 255, 0) 0%,
        rgba(255, 255, 255, 0.45) 50%,
        rgba(255, 255, 255, 0) 100%
      );
      transform: rotate(25deg);
      transition: all 0.8s ease;
    }
    .shimmer-sweep:hover::after {
      left: 150%;
    }

    /* RTL Direction Mirror Adjustments */
    [dir="rtl"] {
      text-align: right;
    }
    [dir="rtl"] .dropdown-menu {
      left: auto !important;
      right: 0 !important;
    }
    [dir="rtl"] .rtl-mirror {
      transform: scaleX(-1);
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    .dark ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(197, 160, 89, 0.45);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(197, 160, 89, 0.8);
    }

    /* ========================================================= */
    *, ::before, ::after {
      box-sizing: border-box !important;
    }
    html, body {
      max-width: 100vw !important;
      overflow-x: hidden !important;
      position: relative;
      margin: 0;
      padding: 0;
      -webkit-text-size-adjust: 100%;
    }
    img, video, iframe, canvas, svg {
      max-width: 100% !important;
      height: auto;
    }
    p, span, h1, h2, h3, h4, h5, h6, a, button, label, li {
      overflow-wrap: break-word !important;
      word-wrap: break-word !important;
    }
    section, header, footer, main, aside, article {
      max-width: 100vw !important;
      overflow-x: clip !important;
      box-sizing: border-box !important;
    }

    @media (max-width: 360px) {

      // Laptop View vs iPad Pro / Tablet / Mobile View state
      const [isLaptopView, setIsLaptopView] = useState(() => {
        if (typeof window === 'undefined') return true;
        const ua = navigator.userAgent || '';
        const isIPad = /iPad/i.test(ua) || ((navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) && navigator.maxTouchPoints > 1);
        return window.innerWidth > 1024 && !isIPad;
      });

      useEffect(() => {
        const updateLayout = () => {
          const ua = navigator.userAgent || '';
          const isIPad = /iPad/i.test(ua) || ((navigator.platform === 'MacIntel' || /Macintosh/i.test(ua)) && navigator.maxTouchPoints > 1);
          setIsLaptopView(window.innerWidth > 1024 && !isIPad);
        };
        updateLayout();
        window.addEventListener('resize', updateLayout);
        return () => window.removeEventListener('resize', updateLayout);
      }, []);

      // Initialize theme based on document class or preference
      useEffect(() => {
        if (document.documentElement.classList.contains('dark')) {
          setIsDark(true);
        }
      }, []);

      // Toggle Dark Mode
      const toggleDarkMode = () => {
        setIsDark(prev => {
          const next = !prev;
          if (next) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
          return next;
        });
      };

      // Toggle RTL Mode
      const toggleRTL = () => {
        setIsRTL(prev => {
          const next = !prev;
          if (next) {
            document.documentElement.setAttribute('dir', 'rtl');
          } else {
            document.documentElement.setAttribute('dir', 'ltr');
          }
          return next;

                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-obsidian-850 text-slate-800 dark:text-slate-100 text-sm focus:outline-none focus:border-gold-500 focus:ring-2 focus:ring-gold-500/20"
                      />
                    </div>

                    <div className="pt-2">
                      <Button3D size="lg">
                        Authenticate & Access
                      </Button3D>
                    </div>
                  </form>
                </motion.div>
              </div>
            )}
          </AnimatePresence>

          {/* Luxury Comprehensive Clinic Footer Based on Navbar */}
          <Footer
            activeNav={activeNav}
            handleNavClick={handleNavClick}
            setLoginModal={setLoginModal}
          />

        </div>
      );
    }

    // Mount to DOM
    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
